name: Rebuild PDF from slides

on:
  push:
    branches: [main]
    paths:
      - "index.html"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build PDF from index.html
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 scripts/build-pdf.py

      - name: Commit updated PDF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Signal-Desk-Slides.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date, nothing to commit."
          else
            git commit -m "Auto-regenerate PDF from index.html [skip ci]"
            git push
          fi
